name: Supabase Keep Alive
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s "https://sloamqnvbstpihfzsfqk.supabase.co/rest/v1/acesso_log?select=*&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
